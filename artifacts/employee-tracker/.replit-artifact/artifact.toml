kind = "web"
previewPath = "/"
title = "Employee Time Tracker"
version = "1.0.0"
id = "artifacts/employee-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20728
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/employee-tracker run dev"

[services.env]
PORT = "20728"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/employee-tracker", "run", "build"]
publicDir = "artifacts/employee-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
